/* Kinekit Studio - pro editing suite layout.
   menubar / [outliner | viewport | properties] / timeline / status bar. Panels resize by their splitters. */
:root {
  color-scheme: dark;
  --bg: #161618;
  --panel: #1f1f22;
  --panel-2: #26262a;
  --panel-3: #2e2e33;
  --raise: #36363c;
  --line: #34343a;
  --line-2: #44444b;
  --text: #e6e6e9;
  --muted: #a3a3ab;
  --faint: #6e6e78;
  --accent: #ff5b3d;
  --accent-ink: #1b0b07;
  --act: #ffaa40;        /* active selection (Blender orange) */
  --sel: #f07a1f;        /* other selected */
  --key: #f5c542;        /* keyframes */
  --cam: #5ea2ff;        /* camera */
  --ok: #5fd39a;
  --stage: #121214;
  --f-ui: 'Inter', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --f-display: 'KBebas', 'Bebas Neue', Impact, sans-serif;
  --r: 4px;
  --lw: 270px; --rw: 340px; --th: 300px;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--text); font: 12.5px/1.4 var(--f-ui); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--act); outline-offset: 1px; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #3a3a40; border-radius: 6px; border: 2px solid var(--panel); } ::-webkit-scrollbar-track { background: transparent; }

.app { display: grid; height: 100vh; width: 100vw;
  grid-template-columns: var(--lw) 4px minmax(0, 1fr) 4px var(--rw);
  grid-template-rows: 32px minmax(0, 1fr) var(--hts, 4px) var(--thv, var(--th)) var(--stb, 24px);
  grid-template-areas: "menu menu menu menu menu" "left sl view sr right" "ht ht ht ht ht" "time time time time time" "status status status status status"; }
.app[data-left=closed] { grid-template-columns: 0 0 minmax(0, 1fr) 4px var(--rw); }
.app[data-left=closed] .left, .app[data-left=closed] .split-l { display: none; }
.app[data-right=closed] { grid-template-columns: var(--lw) 4px minmax(0, 1fr) 0 0; }
.app[data-right=closed] .right, .app[data-right=closed] .split-r { display: none; }
.app[data-left=closed][data-right=closed] { grid-template-columns: 0 0 minmax(0, 1fr) 0 0; }
.split { background: var(--bg); position: relative; z-index: 3; }
.split:hover, .split.drag { background: var(--act); }
.split-l { grid-area: sl; cursor: col-resize; } .split-r { grid-area: sr; cursor: col-resize; }
.split-t { grid-area: ht; cursor: row-resize; }

/* ---------- menubar */
.menubar { grid-area: menu; display: flex; align-items: center; gap: 2px; padding: 0 8px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.logo { font: 20px/1 var(--f-display); letter-spacing: .04em; margin-right: 10px; white-space: nowrap; }
.logo b { color: var(--accent); font-weight: normal; }
.mbtn { border: 0; background: transparent; padding: 4px 9px; border-radius: var(--r); cursor: pointer; color: var(--text); }
.mbtn:hover, .mbtn[aria-expanded=true] { background: var(--raise); }
.menubar .title-in { margin-left: 12px; flex: 0 1 240px; width: 240px; min-width: 80px; background: transparent; border: 1px solid transparent; border-radius: var(--r); padding: 3px 8px; font-weight: 500; }
.menubar .title-in:hover, .menubar .title-in:focus { border-color: var(--line-2); background: var(--panel-2); }
.chip { font: 600 10.5px var(--f-ui); letter-spacing: .04em; padding: 2px 8px; border-radius: 99px; background: var(--panel-3); color: var(--muted); white-space: nowrap; max-width: 30ch; overflow: hidden; text-overflow: ellipsis; }
.chip.base { background: color-mix(in srgb, var(--key) 18%, transparent); color: var(--key); }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--panel-3); border-radius: var(--r); padding: 4px 10px; cursor: pointer; white-space: nowrap; font-weight: 500; min-height: 26px; }
.btn:hover { background: var(--raise); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--panel-3); }
.btn.sm { padding: 2px 8px; min-height: 22px; font-size: 12px; }
.btn.danger:hover { color: #ff7b66; border-color: #7a3328; }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.on, .btn[aria-pressed=true] { background: color-mix(in srgb, var(--act) 22%, var(--panel-3)); border-color: color-mix(in srgb, var(--act) 60%, transparent); color: #fff; }
.icon { width: 15px; height: 15px; flex: none; }
.ibtn { width: 26px; height: 26px; display: inline-grid; place-items: center; border: 1px solid transparent; border-radius: var(--r); background: transparent; color: var(--muted); cursor: pointer; padding: 0; flex: none; }
.ibtn:hover { background: var(--panel-3); color: var(--text); }
.ibtn[aria-pressed=true] { background: color-mix(in srgb, var(--act) 20%, transparent); border-color: color-mix(in srgb, var(--act) 55%, transparent); color: #fff; }
.ibtn svg { width: 15px; height: 15px; }
.ibtn[disabled] { opacity: .35; cursor: default; }
.sep { width: 1px; height: 18px; background: var(--line-2); margin: 0 4px; flex: none; }

/* ---------- popup menus (dropdowns + right-click) */
.pop { position: fixed; z-index: 60; min-width: 220px; background: #2a2a2f; border: 1px solid #44444c; border-radius: 6px; padding: 4px; box-shadow: 0 14px 40px rgb(0 0 0 / .55); }
.pop .mi { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 5px 10px; border-radius: 4px; cursor: pointer; text-align: left; color: var(--text); white-space: nowrap; }
.pop .mi:hover, .pop .mi.hot { background: #3d5f9e; color: #fff; }
.pop .mi[disabled] { opacity: .4; pointer-events: none; }
.pop .mi .kb { margin-left: auto; padding-left: 24px; font: 11px var(--f-mono); color: var(--faint); }
.pop .mi:hover .kb { color: #dfe7ff; }
.pop .mi .ck { width: 12px; color: var(--act); }
.pop .mh { font: 600 10.5px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 6px 10px 3px; }
.pop .ms { height: 1px; background: #3e3e45; margin: 4px 2px; }
.pop .sub { position: relative; }
.pop .sub > .mi::after { content: '▸'; margin-left: auto; color: var(--faint); padding-left: 16px; }
.pop .subpop { display: none; position: absolute; left: 100%; top: -5px; }
.pop .sub:hover > .subpop { display: block; }

/* ---------- panels */
.panel { background: var(--panel); min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.left { grid-area: left; }
.right { grid-area: right; flex-direction: row; }
.phead { display: flex; align-items: center; gap: 4px; padding: 0 6px; height: 30px; border-bottom: 1px solid var(--line); flex: none; background: var(--panel-2); }
.ptab { border: 0; background: transparent; padding: 5px 10px; border-radius: var(--r); cursor: pointer; color: var(--muted); font-weight: 600; font-size: 12px; }
.ptab[aria-selected=true] { color: var(--text); background: var(--panel-3); }
.pscroll { flex: 1; min-height: 0; overflow: auto; }

/* outliner */
.otools { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); flex: none; }
.otools input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 3px 8px; }
.orow { display: grid; grid-template-columns: 18px 18px minmax(0, 1fr) auto 22px 22px; align-items: center; gap: 2px; height: 24px; padding: 0 4px 0 6px; cursor: default; user-select: none; border-left: 2px solid transparent; }
.orow:nth-child(even) { background: rgb(255 255 255 / .018); }
.orow:hover { background: rgb(255 255 255 / .05); }
.orow.sel { background: color-mix(in srgb, var(--sel) 22%, transparent); }
.orow.act { background: color-mix(in srgb, var(--act) 30%, transparent); border-left-color: var(--act); }
.orow.off .on { opacity: .45; }
.orow .tw { color: var(--faint); font-size: 10px; text-align: center; }
.orow .ty { width: 16px; height: 16px; display: grid; place-items: center; }
.orow .ty svg { width: 14px; height: 14px; }
.orow .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
.orow .nm input { width: 100%; background: var(--bg); border: 1px solid var(--act); border-radius: 3px; padding: 0 4px; }
.orow .mt { font: 10.5px var(--f-mono); color: var(--faint); padding-left: 6px; white-space: nowrap; }
.orow .tg { width: 20px; height: 20px; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); border-radius: 3px; cursor: pointer; padding: 0; }
.orow .tg:hover { background: var(--raise); color: var(--text); }
.orow .tg.offv { color: var(--faint); opacity: .6; }
.orow .tg svg { width: 13px; height: 13px; }
.orow.drop-above { box-shadow: inset 0 2px 0 var(--act); } .orow.drop-below { box-shadow: inset 0 -2px 0 var(--act); }
.ohead { font: 600 10.5px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 8px 10px 4px; }
.oempty { color: var(--faint); padding: 12px; }

/* library */
.lib { padding: 10px; display: grid; gap: 14px; }
.lib h3 { margin: 0; font: 600 10.5px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.tile { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 8px; text-align: left; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.tile:hover { border-color: var(--line-2); background: var(--panel-3); }
.tile b { font-weight: 600; } .tile i { font-style: normal; color: var(--faint); font-size: 11px; }
.tile .ti { display: flex; align-items: center; gap: 6px; }
.tile svg { width: 15px; height: 15px; color: var(--muted); }

/* ---------- viewport */
.view { grid-area: view; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--stage); }
.vhead { display: flex; align-items: center; gap: 4px; padding: 0 6px; height: 34px; background: var(--panel-2); border-bottom: 1px solid var(--line); flex: none; min-width: 0; overflow: hidden; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 1px; gap: 1px; flex: none; }
.seg button { border: 0; background: transparent; border-radius: 3px; padding: 3px 9px; cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed=true] { background: var(--raise); color: var(--text); }
.seg button svg { width: 14px; height: 14px; }
.vbody { flex: 1; min-height: 0; position: relative; display: grid; grid-template-columns: minmax(0, 1fr); }
.app[data-view=both] .vbody { grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1fr); }
.app[data-view=both] .vdiv { display: block; }
.vdiv { display: none; background: var(--line); }
.vp { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.app[data-view="3d"] .vp2d, .app[data-view=cam] .vp3d { display: none; }
.vp2d { display: grid; place-items: center; padding: 22px; container-type: size; }
.frame { --ar: 0.5625; position: relative; aspect-ratio: var(--ar); width: min(100cqw, 100cqh * var(--ar)); box-shadow: 0 0 0 1px #000, 0 18px 60px rgb(0 0 0 / .55); }
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.vlabel { position: absolute; left: 10px; top: 8px; font: 11.5px var(--f-ui); color: #cfcfd6; text-shadow: 0 1px 2px #000; pointer-events: none; z-index: 2; white-space: nowrap; }
.vlabel small { color: var(--faint); font-family: var(--f-mono); }
.vtools { position: absolute; left: 8px; top: 34px; display: grid; gap: 2px; padding: 3px; background: rgb(32 32 36 / .9); border: 1px solid var(--line); border-radius: 6px; z-index: 4; }
.vtools .ibtn { width: 30px; height: 30px; color: var(--muted); }
.vtools .ibtn svg { width: 17px; height: 17px; }
.vtools .vs { height: 1px; background: var(--line-2); margin: 2px 3px; }
.vp3d { background: #2b2b30; }
.vp3d canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.v3msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); z-index: 3; padding: 20px; text-align: center; }
.navg { position: absolute; right: 8px; top: 8px; z-index: 4; display: grid; justify-items: center; gap: 4px; }
.navg canvas { position: static !important; width: 84px !important; height: 84px !important; cursor: grab; border-radius: 50%; }
.navg canvas:hover { background: rgb(255 255 255 / .06); }
.navg .ibtn { background: rgb(40 40 46 / .85); border-radius: 50%; width: 30px; height: 30px; color: #ccc; cursor: grab; }
.modal-hud { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgb(20 20 24 / .9); border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 12px; font: 12px var(--f-mono); color: #fff; z-index: 6; pointer-events: none; white-space: nowrap; }
.boxsel { position: fixed; border: 1px dashed #fff; background: rgb(255 255 255 / .06); z-index: 50; pointer-events: none; }

/* ---------- properties */
.ptabsv { width: 34px; flex: none; background: var(--panel-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; padding: 6px 3px; }
.ptabsv button { width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 5px; background: transparent; color: var(--faint); cursor: pointer; padding: 0; }
.ptabsv button:hover { color: var(--text); background: var(--panel-3); }
.ptabsv button[aria-selected=true] { background: var(--panel); color: var(--act); box-shadow: inset 2px 0 0 var(--act); }
.ptabsv svg { width: 16px; height: 16px; }
.pbodywrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ihead { display: flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; height: 34px; border-bottom: 1px solid var(--line); flex: none; min-width: 0; }
.ihead b { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ihead .ty { font: 600 10px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--act); }
.ihead .ty.cam { color: var(--cam); }
.sec { border-bottom: 1px solid var(--line); }
.sec > h2 { margin: 0; padding: 7px 10px; font: 600 12px var(--f-ui); color: var(--text); display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; background: var(--panel-2); }
.sec > h2::before { content: '▾'; color: var(--faint); font-size: 10px; width: 10px; }
.sec.closed > h2::before { content: '▸'; }
.sec.closed > .sb { display: none; }
.sec > h2 .hint { margin-left: auto; font: 400 11px var(--f-ui); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
.sec > h2 .hbtn { margin-left: auto; }
.sb { padding: 10px; display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.row > label, .lbl { color: var(--muted); min-width: 86px; flex: none; font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.field { display: grid; gap: 3px; min-width: 0; }
.field > span { font-size: 11px; color: var(--faint); }
input[type=text], input[type=number], select, textarea, input[type=search] { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 7px; min-width: 0; width: 100%; height: 26px; }
textarea { height: auto; }
input:focus, select:focus, textarea:focus { border-color: #5a7ec2; outline: none; }
input[type=number] { font-family: var(--f-mono); font-size: 12px; }
textarea { resize: vertical; min-height: 58px; font: 20px/1.05 var(--f-display); letter-spacing: .02em; }
input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); cursor: pointer; flex: none; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--act); height: 18px; }
.val { font: 11.5px var(--f-mono); color: var(--muted); min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
.desc { font-size: 11.5px; color: var(--faint); margin: 0; line-height: 1.45; }
.warn { font-size: 11.5px; color: var(--key); background: color-mix(in srgb, var(--key) 10%, transparent); border: 1px solid color-mix(in srgb, var(--key) 35%, transparent); border-radius: var(--r); padding: 6px 8px; margin: 0; }
.okmsg { font-size: 11.5px; color: var(--ok); margin: 0; }
.tog { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.tog input { width: 14px; height: 14px; accent-color: var(--act); margin: 0; }
.fxrow { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
.empty { padding: 26px 16px; color: var(--muted); display: grid; gap: 10px; }
.empty b { font-size: 15px; color: var(--text); }
.kbtn { width: 22px; height: 22px; display: inline-grid; place-items: center; border: 0; background: transparent; cursor: pointer; padding: 0; color: var(--faint); flex: none; }
.kbtn svg { width: 12px; height: 12px; }
.kbtn.has { color: var(--key); } .kbtn.on { color: #fff; }
.kbtn:hover { color: var(--key); }
/* transform field: drag the label to scrub (Blender-style) */
.xf { display: grid; grid-template-columns: 74px minmax(0, 1fr) 22px; align-items: center; gap: 4px; }
.xf > label { color: var(--muted); cursor: ew-resize; user-select: none; font-size: 12px; }
.xf > label:hover { color: var(--text); }
.xf input.keyed { background: color-mix(in srgb, var(--key) 14%, var(--bg)); border-color: color-mix(in srgb, var(--key) 40%, var(--line)); }
.xf input.onkey { background: color-mix(in srgb, var(--key) 30%, var(--bg)); border-color: var(--key); }
.styles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.sty { border: 1px solid var(--line); background: var(--panel-2); border-radius: 5px; padding: 6px 8px; text-align: left; cursor: pointer; min-width: 0; }
.sty:hover { background: var(--panel-3); }
.sty[aria-pressed=true] { border-color: var(--act); box-shadow: inset 0 0 0 1px var(--act); }
.sty b { display: block; font: 17px/1 var(--f-display); letter-spacing: .03em; font-weight: normal; }
.sty i { display: block; font-style: normal; font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.sty .pv { display: block; width: 100%; height: 38px; border-radius: 3px; background: #121214; margin-bottom: 5px; }
.stabs { display: flex; flex-wrap: wrap; gap: 4px; }
.stabs button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 99px; padding: 2px 9px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; }
.stabs button[aria-selected=true] { background: color-mix(in srgb, var(--act) 20%, transparent); border-color: var(--act); color: var(--text); }
.gh { font: 600 10.5px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 4px 0 -2px; display: flex; gap: 8px; align-items: baseline; }
.gh small { font: 400 11px var(--f-ui); letter-spacing: 0; text-transform: none; }
.thumb3d { background: repeating-conic-gradient(#2a2a2f 0% 25%, #222226 0% 50%) 50% / 16px 16px; border: 1px solid var(--line); border-radius: var(--r); min-height: 110px; display: grid; place-items: center; overflow: hidden; }
.thumb3d img, .thumb3d canvas { max-width: 100%; max-height: 170px; display: block; }
.prow { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; }
.keys { display: flex; flex-wrap: wrap; gap: 4px; }
.keys .btn { font: 11.5px var(--f-mono); }
.slotbadge { font: 600 10px var(--f-ui); letter-spacing: .06em; color: var(--key); text-transform: uppercase; }

/* ---------- timeline */
.timeline { grid-area: time; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); border-top: 1px solid var(--line); }
.thead { display: flex; align-items: center; gap: 4px; padding: 0 6px; height: 34px; background: var(--panel-2); border-bottom: 1px solid var(--line); flex: none; min-width: 0; overflow: hidden; }
.tcode { font: 600 15px var(--f-mono); color: var(--act); padding: 0 8px; min-width: 110px; font-variant-numeric: tabular-nums; cursor: text; border: 1px solid transparent; border-radius: var(--r); background: transparent; width: 112px; height: 26px; }
.tcode:hover { border-color: var(--line-2); }
.tlen { font: 11px var(--f-mono); color: var(--faint); white-space: nowrap; }
.tzoom { width: 90px; flex: none; }
.tbody { flex: 1; min-height: 0; overflow: auto; position: relative; }
.tbody canvas { display: block; position: sticky; left: 0; }
.tbody canvas.pin { top: 0; z-index: 2; }
#tlInner { position: relative; min-width: 100%; }
.gbar { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }

/* ---------- status bar */
.status { grid-area: status; display: flex; align-items: center; gap: 14px; padding: 0 10px; background: var(--panel-2); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); min-width: 0; overflow: hidden; white-space: nowrap; }
.status kbd, .help kbd, .pop kbd { font: 600 10.5px var(--f-mono); background: var(--panel-3); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--text); }
.status .hints { display: flex; gap: 12px; overflow: hidden; }
.status .hints span { display: inline-flex; gap: 4px; align-items: center; }
.status .stats b { color: var(--key); font-weight: 600; }
.status .saved { color: var(--faint); }

/* ---------- overlays */
.toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: #2d2d33; border: 1px solid var(--line-2); padding: 8px 14px; border-radius: 6px; max-width: min(620px, calc(100% - 32px)); box-shadow: 0 10px 30px rgb(0 0 0 / .5); z-index: 70; }
.toast.err { border-color: var(--accent); }
.drop { position: fixed; inset: 0; background: rgb(18 16 20 / .85); display: grid; place-items: center; z-index: 80; border: 3px dashed var(--key); font: 32px var(--f-display); letter-spacing: .03em; }
.help { position: fixed; inset: 0; z-index: 75; background: rgb(0 0 0 / .55); display: grid; place-items: center; }
.help > div { background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; width: min(980px, calc(100vw - 40px)); max-height: calc(100vh - 60px); overflow: auto; padding: 18px 22px; box-shadow: 0 20px 60px rgb(0 0 0 / .6); }
.help h2 { margin: 0 0 4px; font-size: 16px; } .help h3 { margin: 14px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--act); }
.help .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 26px; }
.help dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; }
.help dt { white-space: nowrap; } .help dd { margin: 0; color: var(--muted); }

@media (max-width: 1100px) { :root { --lw: 220px; --rw: 300px; } .help .cols { grid-template-columns: 1fr 1fr; } .title-in { width: 150px; } }
@media (max-width: 760px) { .help .cols { grid-template-columns: 1fr; } .logo { display: none; } }

/* ---------- hideable timeline / status bar */
.app[data-time=closed] .timeline, .app[data-time=closed] .split-t { display: none; }
.app[data-status=closed] .status { display: none; }
.tlpeek { position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%); z-index: 40; display: none; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line-2); color: var(--muted); font: 500 11.5px var(--f-ui); cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
.tlpeek:hover { color: var(--text); border-color: var(--act); }
.app[data-time=closed] ~ .tlpeek { display: inline-flex; }
.tlpeek svg { width: 14px; height: 14px; }
.toast { display: flex; align-items: flex-start; gap: 10px; }
.toast[hidden] { display: none; }
.toast .tx { flex: none; background: none; border: 0; color: inherit; opacity: .6; font-size: 16px; line-height: 1; cursor: pointer; padding: 0 2px; }
.toast .tx:hover { opacity: 1; }
/* ---------- template builder */
#templatePane { display: flex; flex-direction: column; gap: 6px; padding: 8px 6px 16px; }
#templatePane[hidden] { display: none; }
.tplhead { display: flex; align-items: baseline; gap: 8px; padding: 2px 6px; }
.tplhead .warnc { color: var(--accent); font-size: 11.5px; font-weight: 600; } .tplhead .okc { color: #7fd18b; font-size: 11.5px; font-weight: 600; }
.tplbtns { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 4px 4px; }
.tplsub { font: 600 10px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 10px 6px 2px; }
.slot { border: 1px solid var(--line); border-radius: 6px; padding: 6px 6px 6px 8px; background: var(--panel-2); cursor: pointer; display: grid; gap: 4px; }
.slot:hover { border-color: var(--line-2); } .slot.on { border-color: var(--act); }
.slot.off { background: transparent; padding: 3px 6px; }
.slothead { display: flex; align-items: center; gap: 6px; min-width: 0; }
.slothead .num { flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--act); color: #111; font: 700 11px var(--f-ui); display: grid; place-items: center; }
.slothead .sic { flex: none; display: inline-flex; width: 14px; color: var(--muted); } .slothead .sic svg { width: 14px; height: 14px; }
.slothead .slotname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
.slotlbl { flex: 1; min-width: 0; height: 22px; font-weight: 600; font-size: 12px; }
.slotmeta { color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slotiss { display: grid; justify-items: start; gap: 4px; font-size: 11.5px; line-height: 1.35; padding: 4px 7px; border-radius: 4px; }
.slotiss .btn { height: 22px; padding: 0 8px; font-size: 11px; }
.slotiss.warn { background: rgba(255,91,61,.1); color: #ffb3a3; } .slotiss.info { background: rgba(94,162,255,.08); color: #a9c8f5; }
/* ---------- auto-reframe dialog */
.help > .rfdlg { width: min(860px, calc(100vw - 40px)); }
.rfbody { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; margin-top: 12px; align-items: start; }
.rfprev { background: #000; border: 1px solid var(--line-2); border-radius: 6px; display: grid; place-items: center; min-height: 240px; padding: 8px; }
.rfprev canvas { max-width: 100%; max-height: 52vh; display: block; }
.rfctl { display: grid; gap: 6px; align-content: start; }
@media (max-width: 700px) { .rfbody { grid-template-columns: 1fr; } }
/* ---------- animators */
.ancard { border: 1px solid var(--line); border-radius: 6px; padding: 8px; display: grid; gap: 6px; background: var(--panel-2); }
.ancard .row select { flex: 1; }
/* ---------- collapse controls */
.vtools .vcol { height: 18px !important; color: var(--faint) !important; }
.vtools .vcol svg { width: 13px !important; height: 13px !important; }
.vtools.closed { padding: 2px; }
.ptabsv { display: flex; flex-direction: column; }
.ptabsv .spacer { flex: 1; }
.pcol { border: 0; background: transparent; color: var(--faint); width: 100%; height: 30px; cursor: pointer; display: grid; place-items: center; }
.pcol:hover { color: var(--text); background: var(--panel-3); }
.pcol svg { width: 14px; height: 14px; }
.edgetab { position: fixed; top: 50%; z-index: 40; display: none; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--muted); cursor: pointer; font: 600 11px var(--f-ui); writing-mode: vertical-rl; transform: translateY(-50%); }
.edgetab svg { width: 14px; height: 14px; writing-mode: horizontal-tb; }
.edgetab:hover { color: var(--text); border-color: var(--act); }
.edgetab.l { left: 0; border-left: 0; border-radius: 0 8px 8px 0; }
.edgetab.r { right: 0; border-right: 0; border-radius: 8px 0 0 8px; }
.app[data-left=closed] ~ .edgetab.l, .app[data-right=closed] ~ .edgetab.r { display: inline-flex; }
/* ---------- project panel (media bin) */
#mediaPane { display: flex; flex-direction: column; gap: 6px; padding: 0 0 16px; }
#mediaPane[hidden] { display: none; }
.mhint { font-size: 11px; color: var(--faint); padding: 0 10px; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; padding: 0 8px; }
.mitem { border: 1px solid var(--line); border-radius: 6px; padding: 4px; background: var(--panel-2); cursor: pointer; display: grid; gap: 3px; min-width: 0; user-select: none; }
.mitem:hover { border-color: var(--line-2); } .mitem.on { border-color: var(--act); } .mitem.unused { opacity: .7; }
.mth { height: 64px; border-radius: 4px; background: #0c0c0f; display: grid; place-items: center; overflow: hidden; }
.mth img { max-width: 100%; max-height: 64px; display: block; }
.mth .mic { color: var(--muted); font-size: 22px; display: grid; place-items: center; } .mth .mic svg { width: 22px; height: 22px; }
.mth .msw { width: 70%; height: 60%; border-radius: 4px; border: 1px solid var(--line-2); }
.mname { font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mmeta { font-size: 10.5px; color: var(--faint); line-height: 1.3; }
.mact { margin: 6px 8px 0; border: 1px solid var(--line-2); border-radius: 6px; padding: 8px; display: grid; gap: 6px; background: var(--panel-2); }

preset('out', 'spin_out', 0.45, 'Spin and shrink away', (u, c) => ({ rot: E.in_back(u, 1.4) * c.param('angle', 200), s: 1 - 0.85 * E.in_cubic(u), op: 1 - E.in_quad(u) }), { order: 'edges', stagger: 0.03 });
preset('out', 'flip_out', 0.35, '3D card flip out', (u) => ({ sx: Math.cos(clamp(E.in_back(u, 1.5), 0, 1) * 90 * Math.PI / 180), op: u < 0.95 ? 1 : 0 }), { stagger: 0.04 });
preset('out', 'sink', 0.4, 'Dip, then drop and fade', (u, c) => ({ dy: E.in_back(u, 1.8) * c.param('dist', 2.5) * c.em, op: 1 - E.in_quad(u) }), { stagger: 0.03 });
preset('out', 'scatter_out', 0.6, 'Fly apart in random directions', (u, c) => { const e = E.in_cubic(u); return { dx: e * c.rand('x', -8, 8) * c.em, dy: e * c.rand('y', -12, 12) * c.em, rot: e * c.rand('r', -240, 240), op: 1 - u }; }, { order: 'random', stagger: 0.01 });
preset('out', 'fold', 0.35, 'Close vertically like a blind', (u) => ({ sy: Math.max(1 - E.in_back(u, 2.0), 0), op: u < 0.95 ? 1 : 0 }), { stagger: 0.05 });
preset('out', 'stretch_out', 0.45, 'Speed-stretch off to the left', (u, c) => { const e = E.in_expo(u); return { dx: -e * c.param('dist', 7) * c.em, sx: 1 + 1.6 * e, sy: 1 - 0.35 * e, op: 1 - clamp((u - 0.7) / 0.3) }; }, { stagger: 0.05 });
preset('out', 'none', 0.0, 'Cut out instantly', () => ({}));

preset('loop', 'float', 0.5, 'Gentle floating drift', (t, c) => ({ dy: c.param('amp', 0.14) * c.em * Math.sin(2 * Math.PI * 0.6 * t + c.rand('p', 0, 6.283)), rot: c.param('rot', 3) * Math.sin(2 * Math.PI * 0.45 * t + c.rand('q', 0, 6.283)) }));
preset('loop', 'pulse', 0.5, 'Heartbeat scale pulse', (t, c) => ({ s: 1 + c.param('amp', 0.06) * Math.sin(2 * Math.PI * c.param('freq', 1.5) * t - c.i * c.param('phase', 0.0)) }));
preset('loop', 'jitter', 0.5, 'Nervous hand-held jitter', (t, c) => { const k = Math.floor(t * c.param('rate', 12)), a = c.param('amp', 0.05); return { dx: c.rand(`jx${k}`, -a, a) * c.em, dy: c.rand(`jy${k}`, -a, a) * c.em, rot: c.rand(`jr${k}`, -2.5, 2.5) }; }, { stepped: true });
preset('loop', 'swing', 0.5, 'Letters sway from their top edge', (t, c) => { const th = c.param('angle', 7) * Math.sin(2 * Math.PI * c.param('freq', 0.9) * t - c.i * 0.35); const [dx, dy] = pivotTop(th, c.h); return { rot: th, dx, dy }; });
preset('loop', 'bounce', 0.5, 'Letters hop in sequence', (t, c) => { let ph = (c.param('freq', 1.6) * t - c.i * 0.12) % 1.0; if (ph < 0) ph += 1; return { dy: -c.param('amp', 0.45) * c.em * (ph < 0.5 ? Math.sin(Math.PI * ph) : 0) }; });
preset('loop', 'breathe', 0.5, 'Slow opacity breathing', (t, c) => ({ op: 0.8 + 0.2 * Math.cos(2 * Math.PI * c.param('freq', 0.8) * t) }));
preset('loop', 'shake', 0.5, 'Fast vibration', (t, c) => ({ dx: c.param('amp', 0.07) * c.em * Math.sin(2 * Math.PI * 13 * t + c.i) }));

// ---- single-layer presets: camera moves
const D2R = Math.PI / 180;
// ------------------------------------------------------------------ stage size (project aspect)
const ASPECTS_KM = { '9:16': [720, 1280], '16:9': [1280, 720], '1:1': [720, 720] };
const ST = { W: 720, H: 1280, aspect: '9:16' };
function setStage(aspect) { const d = ASPECTS_KM[aspect] || ASPECTS_KM['9:16']; ST.W = d[0]; ST.H = d[1]; ST.aspect = ASPECTS_KM[aspect] ? aspect : '9:16'; return ST; }
const SHAPE_W = () => ST.W / 4, SHAPE_H = () => ST.H / 4;   // KineMaster colour layer: natural size = a quarter of the frame
Object.assign(K, { ST, setStage, ASPECTS_KM, SHAPE_W, SHAPE_H });
preset('in', 'punch_in', 0.45, 'Punch zoom: slams in from big, settles with a kick', (u, c) => { const e = E.out_back(u, 1.7), f = c.param('from', 1.9); return { s: f + (1 - f) * e, op: fadeIn(u, 7) }; }, { group: 'camera', stagger: 0.05 });
preset('in', 'whip_in', 0.5, 'Whip pan in from the left with motion stretch', (u, c) => { const k = 1 - E.out_expo(u), d = c.param('dir', -1); return { dx: d * k * c.param('dist', 10) * c.em, sx: 1 + 2.4 * k * k, sy: 1 - 0.3 * k * k, op: fadeIn(u, 5) }; }, { group: 'camera', stagger: 0.06 });
preset('in', 'shake_in', 0.7, 'Lands with a decaying camera shake', (u, c) => { const a = (1 - u) ** 2 * c.param('amp', 1); const t = u * c.param('rate', 9); return { dx: noise(t, c, 'sx') * 0.55 * c.em * a, dy: noise(t, c, 'sy') * 0.35 * c.em * a, rot: noise(t, c, 'sr') * 4 * a, s: 1 + 0.18 * (1 - E.out_cubic(u)), op: fadeIn(u, 8) }; }, { group: 'camera' });
preset('in', 'push_reveal', 0.9, 'Slow push from wide: scale up gently while fading in', (u, c) => ({ s: 0.82 + 0.18 * E.out_cubic(u), op: E.out_quad(u) }), { group: 'camera' });
preset('out', 'whip_out', 0.4, 'Whip pan out to the right with motion stretch', (u, c) => { const k = E.in_expo(u), d = c.param('dir', 1); return { dx: d * k * c.param('dist', 10) * c.em, sx: 1 + 2.4 * k * k, sy: 1 - 0.3 * k * k, op: u < 0.85 ? 1 : (1 - u) / 0.15 }; }, { group: 'camera', stagger: 0.05 });
preset('out', 'shake_out', 0.5, 'Shakes harder and fades away', (u, c) => { const a = u * u * c.param('amp', 1), t = u * 10; return { dx: noise(t, c, 'ox') * 0.6 * c.em * a, dy: noise(t, c, 'oy') * 0.4 * c.em * a, rot: noise(t, c, 'or') * 5 * a, op: 1 - E.in_quad(u) }; }, { group: 'camera' });
preset('out', 'crash_zoom', 0.45, 'Crash zoom into the camera', (u, c) => { const e = E.in_expo(u); return { s: 1 + e * c.param('to', 9), op: u < 0.7 ? 1 : 1 - (u - 0.7) / 0.3 }; }, { group: 'camera', stagger: 0 });
preset('loop', 'push_in', 0.5, 'Slow push-in during the hold (keeps its zoom through the exit)', (t, c) => ({ s: 1 + c.param('amp', 0.07) * clamp((t + c.t0 - c.hold0) / Math.max(c.hold1 - c.hold0, 0.01)) }), { group: 'camera', persist: true });
preset('loop', 'drift', 0.5, 'Slow sideways drift, like a slider shot', (t, c) => { const p = clamp((t + c.t0 - c.hold0) / Math.max(c.hold1 - c.hold0, 0.01)); return { dx: (p - 0.5) * c.param('amp', 0.8) * c.em, dy: (p - 0.5) * -0.15 * c.em }; }, { group: 'camera', persist: true });
preset('loop', 'wiggle', 0.5, 'Organic hand-held wiggle', (t, c) => { const a = c.param('amp', 1), f = c.param('freq', 1); return { dx: noise(t * f, c, 'wx') * 0.08 * c.em * a, dy: noise(t * f, c, 'wy') * 0.06 * c.em * a, rot: noise(t * f, c, 'wr') * 2.2 * a }; }, { group: 'camera' });

// ---- single-layer presets: physics
preset('in', 'bounce_in', 0.8, 'Scales up with a rubber-ball bounce', (u, c) => ({ s: E.out_bounce(u), op: fadeIn(u, 8) }), { group: 'physics' });
preset('in', 'spring_in', 0.9, 'Slides in on a spring and wobbles to a stop', (u, c) => ({ dx: (1 - E.spring(u, 5.5, 2.2)) * c.param('dist', 5) * c.em, op: fadeIn(u, 5) }), { group: 'physics', stagger: 0.06 });
preset('in', 'jelly_in', 0.9, 'Grows in and jiggles like jelly', (u, c) => { const g = E.out_expo(clamp(u * 1.6)), w = Math.exp(-4 * u) * Math.sin(5 * Math.PI * u) * c.param('amount', 0.32); return { s: g, sx: 1 + w, sy: 1 - w, op: fadeIn(u, 6) }; }, { group: 'physics' });
preset('in', 'thud', 0.6, 'Heavy drop that squashes on impact', (u, c) => {
  if (u < 0.45) { const a = u / 0.45; return { dy: -(1 - E.in_cubic(a)) * c.param('height', 9) * c.em, sy: 1 + 0.15 * a, sx: 1 - 0.08 * a, op: fadeIn(u, 10) }; }
  const q = (u - 0.45) / 0.55, w = Math.exp(-6 * q) * Math.cos(2.5 * Math.PI * q); return { sx: 1 + 0.25 * w, sy: 1 - 0.22 * w, dy: 0.1 * c.em * w };
}, { group: 'physics', stagger: 0.07 });
preset('out', 'drop_out', 0.6, 'Falls straight down under gravity', (u, c) => ({ dy: E.in_quad(u) * c.param('dist', 16) * c.em, sy: 1 + 0.2 * E.in_quad(u), op: u < 0.85 ? 1 : (1 - u) / 0.15 }), { group: 'physics', stagger: 0.04 });
preset('out', 'bounce_out', 0.6, 'Hops up once, then drops off screen', (u, c) => { const y = u < 0.35 ? -Math.sin(Math.PI * u / 0.35) * 0.8 * c.em : E.in_quad((u - 0.35) / 0.65) * 16 * c.em; return { dy: y, op: u < 0.9 ? 1 : (1 - u) / 0.1 }; }, { group: 'physics', stagger: 0.05 });
preset('loop', 'jelly', 0.5, 'Continuous jelly wobble', (t, c) => { const w = Math.sin(2 * Math.PI * c.param('freq', 1.8) * t - c.i * 0.5) * c.param('amp', 0.06); return { sx: 1 + w, sy: 1 - w }; }, { group: 'physics' });
preset('loop', 'float_up', 0.5, 'Bobs up and down like it is floating on water', (t, c) => ({ dy: Math.sin(2 * Math.PI * c.param('freq', 0.5) * t - c.i * 0.4) * c.param('amp', 0.12) * c.em, rot: Math.sin(2 * Math.PI * c.param('freq', 0.5) * t * 0.7) * 1.5 }), { group: 'physics' });

// ---- single-layer presets: fake 3D (scale-X / scale-Y as rotation in depth)
preset('in', 'flip_up', 0.55, '3D flip around the horizontal axis', (u, c) => { const a = (1 - E.out_back(u, 1.6)) * 90; return { sy: Math.cos(a * D2R), op: fadeIn(u, 10) }; }, { group: '3d', stagger: 0.05 });
preset('in', 'tumble', 0.8, 'Tumbles forward through 3D space into place', (u, c) => { const e = E.out_back(u, 1.2), a = (1 - e) * 200; return { sy: Math.cos(a * D2R), rot: (1 - e) * -30, s: 0.55 + 0.45 * E.out_cubic(u), dy: -(1 - E.out_cubic(u)) * 2 * c.em, op: fadeIn(u, 4) }; }, { group: '3d', stagger: 0.05 });
preset('in', 'swing_door', 0.7, 'Opens like a door hinged on its left edge', (u, c) => { const a = (1 - E.out_back(u, 1.3)) * 88, sx = Math.cos(a * D2R); return { sx, dx: -(1 - sx) * c.w / 2, op: fadeIn(u, 6) }; }, { group: '3d', stagger: 0.06 });
preset('in', 'roll_up', 0.6, 'Rolls up over a cylinder from below', (u, c) => { const a = (1 - E.out_cubic(u)) * 90; return { sy: Math.cos(a * D2R), dy: Math.sin(a * D2R) * c.h * 0.9, op: fadeIn(u, 5) }; }, { group: '3d', stagger: 0.05 });
preset('in', 'coin_spin', 1.0, 'Spins in like a tossed coin, landing face on', (u, c) => { const a = (1 - E.out_cubic(u)) * c.param('turns', 2) * 360; return { sx: Math.cos(a * D2R), s: 0.5 + 0.5 * E.out_cubic(u), op: fadeIn(u, 4) }; }, { group: '3d', stagger: 0.06 });
preset('out', 'flip_down', 0.4, '3D flip away around the horizontal axis', (u, c) => ({ sy: Math.cos(clamp(E.in_back(u, 1.5), 0, 1) * 90 * D2R), op: u < 0.95 ? 1 : 0 }), { group: '3d', stagger: 0.04 });

preset('out', 'coin_out', 0.7, 'Spins away like a coin and shrinks', (u, c) => { const e = E.in_cubic(u); return { sx: Math.cos(e * 720 * D2R), s: 1 - 0.8 * e, op: 1 - E.in_quad(u) }; }, { group: '3d', stagger: 0.04 });

const safeName = s => (s || 'kinekit').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || 'kinekit';
let dlCap; try { dlCap = window.claude && window.claude.use ? window.claude.use('downloads') : null; } catch (e) { dlCap = null; }
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
function anchorDownload(filename, bytes) {
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
  const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();

/* 1. Save dialog (Chrome / Edge desktop): the user picks the folder, the name stays *.kine
   2. Normal browser tab: a plain download named *.kine (served as octet-stream so nothing renames it)
   3. Inside an embedded preview: the host's save; if it refuses .kine, ask instead of silently adding .zip */
async function offer(filename, bytes) {
  const ext = (filename.match(/\.[a-z0-9]+$/i) || [''])[0].toLowerCase();
  if (window.showSaveFilePicker && !inFrame) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: filename, types: [{ description: ext === '.kine' ? 'KineMaster project' : 'File', accept: { 'application/octet-stream': [ext || '.bin'] } }] });
      const w = await h.createWritable(); await w.write(new Blob([bytes], { type: 'application/octet-stream' })); await w.close(); return 'saved';
    } catch (e) { if (e && e.name === 'AbortError') return 'declined'; /* blocked here: fall through */ }
  }
  if (!inFrame || !dlCap) { anchorDownload(filename, bytes); return 'saved'; }
  const dl = await dlCap;
  if (dl) {
    try { await dl.save({ filename, data: new Blob([bytes], { type: 'application/octet-stream' }) }); return 'saved'; }
    catch (e) {
      if (e && e.code === 'declined') return 'declined';
      if (!(e && e.code === 'rejected_extension')) throw e;
      return await askSave(filename, bytes, dl);
    }
  }
  anchorDownload(filename, bytes); return 'saved';
}
function askSave(filename, bytes, dl) {
  return new Promise(res => {
    const box = $('#help');
    box.innerHTML = `<div role="dialog" aria-label="Save the project" style="max-width:560px"><h2>This preview can't save .kine files</h2>
      <p class="desc" style="font-size:13px;margin:8px 0 14px">The window this app is running in only allows some file types. KineMaster needs the file to end in <b>.kine</b>, so the best fix is to open Kinekit Studio itself in Chrome or Edge (download the HTML file and double-click it): exports there save as .kine directly.</p>
      <div style="display:grid;gap:8px">
        <button class="btn primary" id="svDirect">Try a direct download (${esc(filename)})</button>
        <button class="btn" id="svZip">Save as ${esc(filename)}.zip — I'll rename it to .kine myself</button>
        <button class="btn ghost" id="svCancel">Cancel</button></div>
      <p class="desc" style="margin-top:10px">Renaming: delete only the final ".zip" so the name ends in ".kine". Don't unzip it.</p></div>`;
    box.hidden = false;
    const done = v => { box.hidden = true; box.onclick = null; res(v); };
    $('#svDirect').onclick = () => { anchorDownload(filename, bytes); done('saved'); };
    $('#svZip').onclick = async () => { try { await dl.save({ filename: filename + '.zip', data: new Blob([bytes]) }); done('renamed'); } catch (e) { done('declined'); } };
    $('#svCancel').onclick = () => done('declined');
    box.onclick = e => { if (e.target === box) done('declined'); };
  });
}
